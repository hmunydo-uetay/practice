name: Checkstyle Review

on:
  pull_request:
    branches: [ "main" ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # <--- BẮT BUỘC: Cấp quyền cho bot viết comment vào PR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle

      - name: Checkstyle Review Bot
        uses: dbelyaev/action-checkstyle@v0.5.0
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_file: 'target/checkstyle-result.xml'
          reporter: github-pr-review
          level: warning